manifestVersion: 1
name: "@mgreten/canarytokens"
version: "2026.07.29.1"
description: >
  Normalize caller-supplied Canarytoken incidents with deterministic bounded
  deduplication, and optionally create preview-confirmed web tokens against one
  pinned self-hosted server through a separate creator model.
repository: https://github.com/meagerfindings/swamp-canarytokens
paths:
  base: manifest
additionalFiles:
  - README.md
  - LICENSE.md
  - model_test.ts
  - creator_test.ts
models:
  - model.ts
  - creator.ts
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
